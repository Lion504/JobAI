# Primary experiment: Qwen3-4B with four-bit QLoRA on a standard Colab GPU.
# The larger Qwen3.8-27B experiment is preserved separately in
# configs/model_v2_qwen38_27b.yaml and notebook 06 version 2.
#
# Do NOT silently switch branches. Record the selected model, commit/version,
# hardware, and package versions in the run manifest
# Notebook 06 must first read data/manifests/panel_dataset_card.json and stop
# before loading a base model unless gate.finetuning_ready is true.

candidate_to_run: "Qwen/Qwen3-4B"

candidates:
  - id: "Qwen/Qwen3.8-27B"
    branch: "A"
    architecture: "multimodal_text_only"
    expected_size_b: 27
    minimum_vram_gb: 38
    training_mode: "qlora_4bit"
    freeze_vision: true
  - id: "Qwen/Qwen3.5-9B"
    branch: "A"
    architecture: "multimodal_text_only"
    expected_size_b: 9
    minimum_vram_gb: 14
    training_mode: "qlora_4bit"
    freeze_vision: true
  - id: "Qwen/Qwen3-4B"
    branch: "B"
    architecture: "causal_lm"
    expected_size_b: 4
    minimum_vram_gb: 14
    training_mode: "qlora_4bit"
  - id: "Qwen/Qwen2.5-7B-Instruct"
    branch: "B"
    architecture: "causal_lm"
    expected_size_b: 7
    minimum_vram_gb: 14
    training_mode: "qlora_4bit"
  - id: "Qwen/Qwen3-8B"
    branch: "B"
    architecture: "causal_lm"
    expected_size_b: 8
    minimum_vram_gb: 14
    training_mode: "qlora_4bit"

# LoRA defaults; tune by validation metrics, not by loss.
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  # Notebook 06 creates a model-and-timestamp subfolder under this root for
  # every run. Existing adapters and checkpoints are never overwritten.
  output_root: "models/adapters"
  # Free-Colab pilot: prove that the adapter learns and evaluate it before a
  # full-data run on faster hardware. The full source splits remain unchanged.
  num_train_epochs: 1
  # `legacy_v1` recreates the old prompt. `enhanced_v1` adds only features
  # calculated at or before the forecast origin by notebook 05.
  feature_set: "enhanced_v1"
  # Use all horizons for the shared adapter. For controlled horizon-specific
  # experiments, run notebook 06 separately with [1], [2], and [4].
  training_horizons: [1, 2, 4]

  # Qwen3-4B four-bit QLoRA profile validated on the 15 GB Colab runtime.
  # The short 256-token forecasting records allow a micro-batch of 40 to fit.
  # Enhanced prompts need up to 372 tokens. Batch 12 at 384 tokens has roughly
  # the same token load as batch 18 at the previous 256-token limit.
  per_device_train_batch_size: 12
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.0
  # Use PyTorch AdamW for the small LoRA parameter set. The bitsandbytes paged
  # optimizer triggers CUDA illegal-memory-access errors on the current Colab
  # CUDA/PyTorch stack; four-bit base-model loading still uses bitsandbytes.
  optim: "adamw_torch"
  max_seq_length: 384
  logging_steps: 10
  save_steps: 2000
  eval_steps: 2000
  save_total_limit: 2
  fp16: false
  bf16: true
  # Recompute activations to keep memory use stable on standard Colab GPUs.
  gradient_checkpointing: false
  seed: 42
  # First compare enhanced_v1 directly with the existing 6,000-example
  # legacy_v1 adapter. Change to null only after the enhanced pilot helps on
  # the untouched test sample.
  max_train_examples: 75000
  max_validation_examples: 1000
# Checkpoint selection: validation forecast metrics AND parse success.
checkpoint_selection:
  primary_metric: "val_MAE_mean"
  secondary_metric: "parse_success_rate"
