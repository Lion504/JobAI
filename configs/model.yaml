# Preferred experiment: Qwen3-8B with four-bit QLoRA using the text-only
# causal-language-model loader. Do not silently fall back when the preferred
# model does not fit; select a different configured candidate explicitly.
#
# Do NOT silently switch branches. Record the selected model, commit/version,
# hardware, and package versions in the run manifest
# Notebook 06 must first read data/manifests/panel_dataset_card.json and stop
# before loading a base model unless gate.finetuning_ready is true.

candidate_to_run: "Qwen/Qwen3-8B"

candidates:
  - id: "Qwen/Qwen3.5-9B"
    branch: "A"
    architecture: "multimodal_text_only"
    expected_size_b: 9
    minimum_vram_gb: 14
    training_mode: "qlora_4bit"
    freeze_vision: true
  - id: "Qwen/Qwen3-4B"
    branch: "B"
    architecture: "causal_lm"
    expected_size_b: 4
    minimum_vram_gb: 14
    training_mode: "qlora_4bit"
  - id: "Qwen/Qwen2.5-7B-Instruct"
    branch: "B"
    architecture: "causal_lm"
    expected_size_b: 7
    minimum_vram_gb: 14
    training_mode: "qlora_4bit"
  - id: "Qwen/Qwen3-8B"
    branch: "B"
    architecture: "causal_lm"
    expected_size_b: 8
    minimum_vram_gb: 14
    training_mode: "qlora_4bit"

# LoRA defaults; tune by validation metrics, not by loss.
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "models/adapters/jobai-v1"
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_seq_length: 512
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 2
  fp16: false
  bf16: true
  gradient_checkpointing: true
  seed: 42

# Checkpoint selection: validation forecast metrics AND parse success.
checkpoint_selection:
  primary_metric: "val_MAE_mean"
  secondary_metric: "parse_success_rate"
