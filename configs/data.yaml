          Ammattiryhmä: "all"
          Työmarkkina-asema: ["SSS"]
          timeperiod_m: ["2016M03","2016M06","2016M09","2016M12","2017M03","2017M06","2017M09","2017M12","2018M03","2018M06","2018M09","2018M12"]
          contentscode: ["AVPAIKATYHT"]
      - description: "19 provinces x all occupations x quarter ends (2019Q1–2021Q4)"
        query:
          Alue: ["MK01","MK02","MK04","MK05","MK06","MK07","MK08","MK09","MK10","MK11","MK12","MK13","MK14","MK15","MK16","MK17","MK18","MK19","MK21"]
          Ammattiryhmä: "all"
          Työmarkkina-asema: ["SSS"]
          timeperiod_m: ["2019M03","2019M06","2019M09","2019M12","2020M03","2020M06","2020M09","2020M12","2021M03","2021M06","2021M09","2021M12"]
          contentscode: ["AVPAIKATYHT"]
