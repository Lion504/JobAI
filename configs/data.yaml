# Statistics Finland PxWeb data-source defaults.
# All variable codes must be discovered at runtime from each table's metadata;
# nothing in this file hard-codes statistical labels.

pxweb:
  base_url: "https://pxdata.stat.fi/PxWeb/api/v1"
  request_timeout_seconds: 120
  retry_attempts: 3
  retry_backoff_seconds: 2

# Each table is fetched with one or more slices. KEHA tables can be huge
# (millions of cells in their full form) and the PxWeb API rejects requests
# above the configured API limit (currently about 120k cells). For each table we declare the slices we
# want. Notebook 01 issues one POST per slice and concatenates the results.
#
# A "slice" is a list of {code: filter-values} pairs. If a dimension is not
# in the slice, the API default (often "all") is used and the resulting
# response can be too large. Always declare every dimension with an explicit
# value list.
#
# All KEHA monthly series are aggregated to quarters in notebook 02 using
# keha_monthly_to_quarter below. The default rule is "end_of_quarter" which
# is correct for stock measures (jobseekers, vacancies at end of month).
# A series can override this per-table.

# -----------------------------------------------------------------------------
# WHY SOME TABLES FETCH PARTIAL DATA (not "all")
# -----------------------------------------------------------------------------
#
# PxWeb API cell limits:
#   - ATP tables (11l1, 11n1) are small (270 rows each with the current
#     metadata) and fetched fully using `contentscode: "all"` and time="all".
#   - KEHA tables (12tu, 12tw, 12r5) are massive in their full form — millions
#     of cells. The PxWeb API rejects requests above its configured cell limit.
#     These tables MUST be sliced with explicit dimension filters.
#
# Slicing strategy for KEHA tables:
#   - 12tu: all occupations for 19 provinces, total status, vacancy count,
#     and quarter-end months. Five three-year time slices stay API-safe.
#   - 12tw: all industries for 19 provinces, total employer sector, total job
#     duration, and vacancy count. Yearly slices stay well below the API limit.
#   - 12r5: all official geographies and both vacancy measures at quarter ends.
#   - Non-vacancy measures and overlapping sector/duration cross-products are
#     intentionally excluded because they are not forecasting targets.
#
# Cell-count verification (notebook 01 prints n_cells per slice):
#   - 12tu: 19×434×12×1×1 = 98,952 in a full three-year slice
#   - 12tw: 19×113×1×1×12×1 = 25,764 in a full yearly slice
#   - 12r5: 421×70×2 = 58,940 for all quarter ends
#
# To expand further: add more regions, occupations, or industries — but each
# expansion multiplies request size. Always verify n_cells stays below the live API limit in notebook 01's
# slice-resolution cell.

tables:
  national_vacancies:
    path: "StatFin/atp/11l1.px"
    title: "Job vacancies by Information and Quarter (whole country)"
    slices:
      - description: "all 5 contents x all 54 quarters (2013Q1–2026Q2)"
        query:
          contentscode: "all"
          timeperiod_q: "all"

  regional_vacancies:
    path: "StatFin/atp/11n1.px"
    title: "Job vacancies by Major region, Quarter and Information"
    slices:
      - description: "all 5 regions x all current contents x all 54 quarters (currently 270 cells)"
        query:
          alue_16_20180101: "all"
          contentscode: "all"
          timeperiod_q: "all"

  keha_jobseekers_vacancies_by_occupation:
    path: "StatFin/tyonv/12tu.px"
    title: "KEHA: vacancies by Province x Occupation"
    monthly_to_quarterly:
      rule: "end_of_quarter"
    slices:
      # All 434 occupation codes are fetched for the 19 actual provinces.
      # Only total labour-market status and vacancy counts are required for the
      # panel target. Selecting quarter-end months directly keeps every request
      # below the PxWeb API limit: 19 x 434 x 12 = 98,952 cells.
      - description: "19 provinces x all occupations x quarter ends (2013Q1–2015Q4)"
        query:
