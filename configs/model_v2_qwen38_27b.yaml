# Preferred experiment: Qwen3.8-27B with four-bit QLoRA on an 80 GB Colab GPU.
# Qwen3.8 is multimodal, but this project uses text-only examples, disables
# thinking output, and freezes vision parameters.
#
# Do NOT silently switch branches. Record the selected model, commit/version,
# hardware, and package versions in the run manifest
# Notebook 06 must first read data/manifests/panel_dataset_card.json and stop
# before loading a base model unless gate.finetuning_ready is true.

candidate_to_run: "Qwen/Qwen3.8-27B"

candidates:
  - id: "Qwen/Qwen3.8-27B"
    branch: "A"
    architecture: "multimodal_text_only"
    expected_size_b: 27
    minimum_vram_gb: 38
    training_mode: "qlora_4bit"
    freeze_vision: true
  - id: "Qwen/Qwen3.5-9B"
    branch: "A"
    architecture: "multimodal_text_only"
    expected_size_b: 9
    minimum_vram_gb: 14
    training_mode: "qlora_4bit"
    freeze_vision: true
  - id: "Qwen/Qwen3-4B"
    branch: "B"
    architecture: "causal_lm"
    expected_size_b: 4
    minimum_vram_gb: 14
    training_mode: "qlora_4bit"
  - id: "Qwen/Qwen2.5-7B-Instruct"
    branch: "B"
    architecture: "causal_lm"
    expected_size_b: 7
    minimum_vram_gb: 14
    training_mode: "qlora_4bit"
  - id: "Qwen/Qwen3-8B"
    branch: "B"
    architecture: "causal_lm"
    expected_size_b: 8
    minimum_vram_gb: 14
    training_mode: "qlora_4bit"

# LoRA defaults; tune by validation metrics, not by loss.
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  # Notebook 06 creates a model-and-timestamp subfolder under this root for
  # every run. Existing adapters and checkpoints are never overwritten.
  output_root: "models/adapters"
  # Free-Colab pilot: prove that the adapter learns and evaluate it before a
  # full-data run on faster hardware. The full source splits remain unchanged.
  num_train_epochs: 1
  max_train_examples: 6000
  max_validation_examples: 1000
  # Conservative Qwen3.8-27B profile for a 40 GB A100. Accumulation preserves
  # an effective batch of eight without holding eight sequences in VRAM.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.0
  # Use PyTorch AdamW for the small LoRA parameter set. The bitsandbytes paged
  # optimizer triggers CUDA illegal-memory-access errors on the current Colab
  # CUDA/PyTorch stack; four-bit base-model loading still uses bitsandbytes.
  optim: "adamw_torch"
  max_seq_length: 256
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 2
  fp16: false
  bf16: true
  # Recompute activations to keep the 27B model inside a 40 GB runtime.
  gradient_checkpointing: true
  seed: 42

# Checkpoint selection: validation forecast metrics AND parse success.
checkpoint_selection:
  primary_metric: "val_MAE_mean"
  secondary_metric: "parse_success_rate"
