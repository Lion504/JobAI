# Rolling-origin evaluation cutoffs.
# a split only when ALL of its target labels are available by the relevant cutoff.
# With data ending 2026Q2, complete labels are available only for:
#   1Q forecasts with origins through 2026Q1
#   2Q forecasts with origins through 2025Q4
#   4Q forecasts with origins through 2025Q2
# Report sample counts separately by horizon.

splits:
  train_end: "2022Q4" # last origin quarter whose 4Q target fits
  val_start: "2023Q1"
  val_end: "2024Q2" # last origin whose 4Q target fits within val
  test_start: "2024Q3"
  test_end: "2026Q1" # last 1Q-eligible origin; 4Q reach 2025Q2 then stops

# Forecast horizons, in quarters.
horizons: [1, 2, 4]

# Input feature window length, in quarters. Twelve quarters expose three annual
# cycles while remaining short enough for the Qwen3-4B Colab training profile.
feature_window_quarters: 12

# Derived only from information available at the forecast origin. Notebook 05
# stores these with every example; notebooks 04 and 06 use the same definitions.
engineered_feature_set: "enhanced_v1"
engineered_features:
  - quarter_of_year
  - qoq_change_scaled
  - yoy_change_scaled
  - recent_mean_4_scaled
  - window_mean_scaled
  - recent_slope_4_scaled
  - window_slope_scaled
  - recent_std_4_scaled
  - window_std_scaled
  - zero_fraction_window

# Future controlled experiments may change the active window to 12 or 16 and
# rebuild notebooks 04-07. The current comparable production window remains 8.
feature_window_candidates: [8, 12, 16]

# Metrics to report per (series, horizon, split). All four are required.
metrics:
  - MAE
  - RMSE
  - MASE
  - sMAPE

# All required baselines must run and persist prediction-level results.
baselines:
  - name: "seasonal_naive"
    description: "Value at origin+h equals value at origin+h-4."
  - name: "last_value"
    description: "Value at origin+h equals value at origin."
  - name: "linear_regression"
    description: "Ridge regression on the configured quarterly lag window."
  - name: "ridge_enhanced"
    description: "Ridge regression on the same lag window plus origin-safe trend, seasonality, volatility, and zero-pattern features."

# Deterministic selection thresholds used by notebooks 03 and 05.
panel_selection:
  minimum_non_null_quarters: 48
  maximum_zero_fraction: 0.50
  minimum_variance: 1.0e-12
  # All five tables contribute direct forecast targets. ATP series preserve
  # official national/broad-region coverage, while KEHA contributes detailed
  # occupation, industry, and geographic coverage.
  target_tables: ["11l1", "11n1", "12tu", "12tw", "12r5"]
  target_contentscodes:
    11l1: ["atp_lkm", "atp_eihoit", "atp_osa", "atp_maar", "atp_vaik"]
    11n1: ["atp_lkm"]
    12tu: ["AVPAIKATYHT"]
    12tw: ["AVPAIKATLOPUSSA"]
    12r5: ["AVPAIKATLOPUSSA", "UUDETAVP"]
  # 11n1/SSS duplicates the authoritative 11l1 national vacancy series.
  # 12r5 province-level end-of-month totals duplicate 12tw total-industry rows
  # when the same province exists in 12tw. Notebook 03 detects the exact set.
  duplicate_precedence:
    national_atp: "11l1"
    province_end_of_month_keha: "12tw"

# Fine-tuning is gated on the panel produced by notebook 05.
finetuning_gate:
  minimum_selected_panel_series: 100
  minimum_train_examples: 10000
  require_normalization_assertions: true
  require_baseline_report: true

# Random seed for any stochastic step in the evaluation pipeline.
seed: 42
